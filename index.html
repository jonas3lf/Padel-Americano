<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Americano & Mexicano</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎾</text></svg>">
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22115%22 fill=%22%2310b981%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%22280%22>🎾</text></svg>">
    <!-- Web App Manifest přes Data URI, aby iOS nehledal externí soubor -->
    <link rel="manifest" href='data:application/manifest+json,{
        "name": "Padel Americano & Mexicano",
        "short_name": "Padel",
        "start_url": "./",
        "display": "standalone",
        "background_color": "%230f172a",
        "theme_color": "%230f172a",
        "icons": [{
            "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22115%22 fill=%22%2310b981%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%22280%22>🎾</text></svg>",
            "sizes": "512x512",
            "type": "image/svg+xml"
        }]
    }'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="americanoApp()">

    <!-- HLAVIČKA APLIKACE -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="bg-emerald-500/20 w-12 h-12 rounded-2xl border border-emerald-500/30 flex items-center justify-center text-2xl shrink-0 shadow-inner">
                    🎾
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-black tracking-widest text-emerald-400 uppercase leading-none">PADEL TURNAJE</span>
                    <span class="text-base font-extrabold text-white tracking-wide mt-0.5">AMERICANO & MEXICANO</span>
                </div>
            </div>

            <nav class="flex bg-slate-900 p-1 rounded-xl border border-slate-700 text-xs w-full sm:w-auto justify-between sm:justify-start">
                <button @click="tab = 'setup'" :class="tab === 'setup' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="flex-1 sm:flex-none px-3.5 py-2 rounded-lg font-semibold transition text-center">Nastavení</button>
                <button @click="tab = 'matches'" :class="tab === 'matches' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="flex-1 sm:flex-none px-3.5 py-2 rounded-lg font-semibold transition text-center" :disabled="!isStarted">Zápasy</button>
                <button @click="tab = 'table'" :class="tab === 'table' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="flex-1 sm:flex-none px-3.5 py-2 rounded-lg font-semibold transition text-center" :disabled="!isStarted">Živá tabulka</button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">

        <!-- 1. SEKCE: NASTAVENÍ -->
        <div x-show="tab === 'setup'" class="space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold text-emerald-300 mb-3">Formát turnaje</h2>
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <button @click="format = 'americano'" 
                        :class="format === 'americano' ? 'bg-emerald-600 text-white border-emerald-500 shadow-lg' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'"
                        class="p-3.5 rounded-xl border font-bold text-sm transition text-center">
                        Americano
                        <span class="block text-[11px] font-normal opacity-80 mt-0.5">Předem daný rozpis</span>
                    </button>
                    <button @click="format = 'mexicano'" 
                        :class="format === 'mexicano' ? 'bg-emerald-600 text-white border-emerald-500 shadow-lg' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'"
                        class="p-3.5 rounded-xl border font-bold text-sm transition text-center">
                        Mexicano
                        <span class="block text-[11px] font-normal opacity-80 mt-0.5">Losuje se podle skóre</span>
                    </button>
                </div>

                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-emerald-300">1. Seznam hráčů</h2>
                    <button @click="clearPlayers" class="text-xs text-rose-400 hover:text-rose-300 font-semibold bg-rose-500/10 px-3 py-1.5 rounded-lg border border-rose-500/20 transition">Smazat všechny hráče</button>
                </div>

                <div class="flex gap-2 mb-4">
                    <input type="text" x-model="newPlayerName" @keydown.enter="addPlayer" placeholder="Jméno hráče..." class="flex-1 bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
                    <button @click="addPlayer" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold transition">Přidat</button>
                </div>

                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Hromadné vložení (každé jméno na nový řádek):</label>
                    <textarea x-model="bulkPlayers" rows="3" placeholder="Jan Novák&#10;Petr Svoboda&#10;..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500"></textarea>
                    <button @click="addBulkPlayers" class="mt-2 bg-slate-700 hover:bg-slate-600 text-xs text-white px-4 py-2 rounded-lg font-semibold transition">Vložit seznam</button>
                </div>

                <div class="flex flex-wrap gap-2 mt-4">
                    <template x-for="(player, index) in players" :key="index">
                        <div class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 text-sm">
                            <span x-text="player"></span>
                            <button @click="removePlayer(index)" class="text-rose-400 hover:text-rose-300 font-bold">&times;</button>
                        </div>
                    </template>
                </div>
                <p class="text-xs text-slate-400 mt-3">Celkem hráčů: <span class="font-bold text-white" x-text="players.length"></span> (ideálně násobek 4)</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-emerald-300">2. Parametry turnaje</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-2 font-semibold uppercase">Počet kurtů</label>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="c in [1, 2, 3, 4, 5, 6]" :key="c">
                                <button @click="courts = c" 
                                    :class="courts === c ? 'bg-emerald-600 text-white border-emerald-500 shadow-lg' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'"
                                    class="w-12 h-12 rounded-full border font-bold flex items-center justify-center transition" 
                                    x-text="c"></button>
                            </template>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Body na zápas (např. 24, 32)</label>
                        <input type="number" x-model.number="pointsPerMatch" min="4" step="2" class="w-full bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="flex gap-4 mt-6">
                    <button @click="generateTournament" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition">
                        Rozlosovat
                    </button>
                    <button @click="resetTournament" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 font-bold py-3.5 px-4 rounded-xl transition text-sm">
                        Reset / Smazat vše
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. SEKCE: ZÁPASY -->
        <div x-show="tab === 'matches'" class="space-y-4">
            <div class="flex justify-between items-center bg-slate-800 p-3 rounded-2xl border border-slate-700 gap-2">
                <button @click="currentRound > 0 ? currentRound-- : null" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 px-3 rounded-xl text-sm font-bold text-center transition" :disabled="currentRound === 0">◀ Předchozí</button>
                <span class="font-bold text-emerald-400 px-2 whitespace-nowrap text-sm">Kolo <span x-text="currentRound + 1"></span> / <span x-text="rounds.length"></span></span>
                <button @click="nextRound()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 px-3 rounded-xl text-sm font-bold text-center transition">Další ▶</button>
            </div>

            <template x-if="rounds.length > 0">
                <div class="bg-amber-500/10 border border-amber-500/20 text-amber-300 p-3.5 rounded-2xl text-xs flex flex-col gap-1.5 shadow-md">
                    <div class="flex items-center gap-1.5 font-bold uppercase tracking-wider text-amber-400">
                        <span>☕ Právě odpočívají (volno):</span>
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        <template x-if="rounds[currentRound].resting && rounds[currentRound].resting.length > 0">
                            <template x-for="restPlayer in rounds[currentRound].resting" :key="restPlayer">
                                <span class="bg-amber-500/20 text-amber-200 px-2.5 py-1 rounded-lg font-semibold text-xs border border-amber-500/30" x-text="restPlayer"></span>
                            </template>
                        </template>
                        <template x-if="!rounds[currentRound].resting || rounds[currentRound].resting.length === 0">
                            <span class="text-slate-400 italic">V tomto kole hrají všichni hráči bez pauzy.</span>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="rounds.length > 0">
                <div class="space-y-3">
                    <template x-for="(match, mIndex) in rounds[currentRound].matches" :key="mIndex">
                        <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl shadow-md">
                            <div class="text-[11px] font-bold text-emerald-400 mb-2 uppercase tracking-wider" x-text="'Kurt ' + (mIndex + 1)"></div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-5 items-center gap-2">
                                <div class="md:col-span-2 bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-700/50">
                                    <div class="text-[10px] text-slate-400 font-semibold">Tým 1</div>
                                    <div class="text-xs font-bold text-white truncate" x-text="match.team1[0] + ' & ' + match.team1[1]"></div>
                                </div>

                                <div class="flex justify-center items-center gap-2 my-1 md:my-0">
                                    <input type="number" min="0" :max="pointsPerMatch" x-model.number="match.score1" @input="updateScore(currentRound, mIndex, 1)" placeholder="-" class="w-14 h-11 bg-slate-900 border border-slate-700 text-center text-lg font-black rounded-xl text-emerald-400 focus:outline-none focus:border-emerald-500">
                                    <span class="text-slate-500 font-bold">:</span>
                                    <input type="number" min="0" :max="pointsPerMatch" x-model.number="match.score2" @input="updateScore(currentRound, mIndex, 2)" placeholder="-" class="w-14 h-11 bg-slate-900 border border-slate-700 text-center text-lg font-black rounded-xl text-emerald-400 focus:outline-none focus:border-emerald-500">
                                </div>

                                <div class="md:col-span-2 bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-700/50 text-right md:text-left">
                                    <div class="text-[10px] text-slate-400 font-semibold">Tým 2</div>
                                    <div class="text-xs font-bold text-white truncate" x-text="match.team2[0] + ' & ' + match.team2[1]"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template x-if="rounds.length > 0">
                <div class="flex justify-between items-center bg-slate-800 p-3 rounded-2xl border border-slate-700 gap-2 mt-4">
                    <button @click="currentRound > 0 ? currentRound-- : null; window.scrollTo({top: 0, behavior: 'smooth'})" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 px-3 rounded-xl text-sm font-bold text-center transition" :disabled="currentRound === 0">◀ Předchozí</button>
                    <span class="font-bold text-emerald-400 px-2 whitespace-nowrap text-sm">Kolo <span x-text="currentRound + 1"></span> / <span x-text="rounds.length"></span></span>
                    <button @click="nextRound(); window.scrollTo({top: 0, behavior: 'smooth'})" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 px-3 rounded-xl text-sm font-bold text-center transition">Další ▶</button>
                </div>
            </template>
        </div>

        <!-- 3. SEKCE: ŽIVÁ TABULKA -->
        <div x-show="tab === 'table'" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
                <div class="p-4 bg-slate-800/80 border-b border-slate-700 font-bold text-emerald-300">Průběžné pořadí hráčů</div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase border-b border-slate-700">
                                <th class="p-3.5 text-center w-12">#</th>
                                <th class="p-3.5">Hráč</th>
                                <th class="p-3.5 text-center">Zápasy</th>
                                <th class="p-3.5 text-center text-emerald-400">Výhry</th>
                                <th class="p-3.5 text-center">Skóre</th>
                                <th class="p-3.5 text-center font-bold text-emerald-400">Body</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50 text-sm">
                            <template x-for="(row, index) in standings" :key="row.name">
                                <tr class="hover:bg-slate-700/20 transition">
                                    <td class="p-3.5 text-center font-bold text-slate-400" x-text="index + 1"></td>
                                    <td class="p-3.5 font-semibold text-white" x-text="row.name"></td>
                                    <td class="p-3.5 text-center text-slate-300" x-text="row.matches"></td>
                                    <td class="p-3.5 text-center font-bold text-emerald-400" x-text="row.wins"></td>
                                    <td class="p-3.5 text-center text-slate-300" x-text="row.scoreFor + ':' + row.scoreAgainst"></td>
                                    <td class="p-3.5 text-center font-black text-emerald-400 text-base" x-text="row.points"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        function americanoApp() {
            return {
                tab: 'setup',
                format: 'americano',
                players: ['Jan', 'Petr', 'Pavel', 'Tomáš', 'Ondřej', 'Martin', 'Lukáš', 'David'],
                newPlayerName: '',
                bulkPlayers: '',
                courts: 2,
                pointsPerMatch: 24,
                isStarted: false,
                rounds: [],
                currentRound: 0,

                init() {
                    const saved = localStorage.getItem('padel_americano_state');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.format = data.format || 'americano';
                        this.players = data.players || this.players;
                        this.courts = data.courts || 2;
                        this.pointsPerMatch = data.pointsPerMatch || 24;
                        this.rounds = data.rounds || [];
                        this.isStarted = data.isStarted || false;
                    }
                },

                saveState() {
                    localStorage.setItem('padel_americano_state', JSON.stringify({
                        format: this.format,
                        players: this.players,
                        courts: this.courts,
                        pointsPerMatch: this.pointsPerMatch,
                        rounds: this.rounds,
                        isStarted: this.isStarted
                    }));
                },

                addPanel() {},

                addPlayer() {
                    if (this.newPlayerName.trim()) {
                        this.players.push(this.newPlayerName.trim());
                        this.newPlayerName = '';
                        this.saveState();
                    }
                },

                addBulkPlayers() {
                    const lines = this.bulkPlayers.split('\n');
                    lines.forEach(l => {
                        if (l.trim()) this.players.push(l.trim());
                    });
                    this.bulkPlayers = '';
                    this.saveState();
                },

                removePlayer(index) {
                    this.players.splice(index, 1);
                    this.saveState();
                },

                clearPlayers() {
                    if (confirm('Opravdu chcete smazat všechny hráče?')) {
                        this.players = [];
                        this.saveState();
                    }
                },

                resetTournament() {
                    if (confirm('Opravdu chcete vyresetovat turnaj a smazat všechna data?')) {
                        localStorage.removeItem('padel_americano_state');
                        this.rounds = [];
                        this.isStarted = false;
                        this.tab = 'setup';
                    }
                },

                nextRound() {
                    if (this.currentRound < this.rounds.length - 1) {
                        this.currentRound++;
                        if (this.format === 'mexicano') {
                            this.generateMexicanoRound(this.currentRound);
                        }
                    } else {
                        this.tab = 'table';
                    }
                },

                generateTournament() {
                    if (this.players.length < 4) {
                        alert('Pro turnaj je potřeba alespoň 4 hráčů.');
                        return;
                    }

                    let numRounds = this.players.length % 2 === 0 ? this.players.length - 1 : this.players.length;
                    
                    if (this.format === 'americano') {
                        let p = [...this.players];
                        let generatedRounds = [];
                        let workingPlayers = [...p];
                        if (workingPlayers.length % 2 !== 0) workingPlayers.push(null); 
                        const n = workingPlayers.length;

                        for (let r = 0; r < numRounds; r++) {
                            let roundPairs = [];
                            let restingPlayers = [];

                            for (let i = 0; i < n / 2; i++) {
                                let p1 = workingPlayers[i];
                                let p2 = workingPlayers[n - 1 - i];

                                if (p1 === null) restingPlayers.push(p2);
                                else if (p2 === null) restingPlayers.push(p1);
                                else roundPairs.push([p1, p2]);
                            }

                            let matchesInRound = [];
                            let currentMatches = Math.floor(roundPairs.length / 2);

                            for (let c = 0; c < this.courts && c < currentMatches; c++) {
                                let team1_player1 = roundPairs[c * 2][0];
                                let team1_player2 = roundPairs[c * 2 + 1][1];
                                let team2_player1 = roundPairs[c * 2][1];
                                let team2_player2 = roundPairs[c * 2 + 1][0];

                                matchesInRound.push({
                                    team1: [team1_player1, team1_player2],
                                    team2: [team2_player1, team2_player2],
                                    score1: '',
                                    score2: '',
                                    played: false
                                });
                            }

                            for (let k = this.courts * 2; k < roundPairs.length; k++) {
                                restingPlayers.push(roundPairs[k][0], roundPairs[k][1]);
                            }

                            generatedRounds.push({ matches: matchesInRound, resting: restingPlayers });

                            let fixed = workingPlayers[0];
                            let rest = workingPlayers.slice(1);
                            rest.unshift(rest.pop());
                            workingPlayers = [fixed, ...rest];
                        }
                        this.rounds = generatedRounds;
                    } else {
                        let generatedRounds = [];
                        for (let r = 0; r < numRounds; r++) {
                            generatedRounds.push({ matches: [], resting: [] });
                        }
                        this.rounds = generatedRounds;
                        this.generateMexicanoRound(0);
                    }

                    this.isStarted = true;
                    this.currentRound = 0;
                    this.tab = 'matches';
                    this.saveState();
                },

                generateMexicanoRound(roundIdx) {
                    let currentStandings = this.standings;
                    let sortedPlayers = currentStandings.map(s => s.name);

                    let restingPlayers = [];
                    if (sortedPlayers.length % 2 !== 0) {
                        restingPlayers.push(sortedPlayers.pop());
                    }

                    let matchesInRound = [];
                    let maxMatches = Math.min(this.courts, Math.floor(sortedPlayers.length / 4));

                    for (let c = 0; c < maxMatches; c++) {
                        let p1 = sortedPlayers[c * 4];
                        let p2 = sortedPlayers[c * 4 + 1];
                        let p3 = sortedPlayers[c * 4 + 2];
                        let p4 = sortedPlayers[c * 4 + 3];

                        matchesInRound.push({
                            team1: [p1, p4],
                            team2: [p2, p3],
                            score1: '',
                            score2: '',
                            played: false
                        });
                    }

                    for (let i = maxMatches * 4; i < sortedPlayers.length; i++) {
                        restingPlayers.push(sortedPlayers[i]);
                    }

                    this.rounds[roundIdx] = {
                        matches: matchesInRound,
                        resting: restingPlayers
                    };
                    this.saveState();
                },

                updateScore(roundIdx, matchIdx, teamNum) {
                    let match = this.rounds[roundIdx].matches[matchIdx];
                    if (match.score1 === '' && match.score2 === '') return;
                    
                    if (teamNum === 1) {
                        if (match.score1 > this.pointsPerMatch) match.score1 = this.pointsPerMatch;
                        if (match.score1 < 0) match.score1 = 0;
                        if (match.score1 !== '') match.score2 = this.pointsPerMatch - match.score1;
                    } else {
                        if (match.score2 > this.pointsPerMatch) match.score2 = this.pointsPerMatch;
                        if (match.score2 < 0) match.score2 = 0;
                        if (match.score2 !== '') match.score1 = this.pointsPerMatch - match.score2;
                    }
                    match.played = (match.score1 !== '' || match.score2 !== '');
                    this.saveState();
                },

                get standings() {
                    let stats = {};
                    this.players.forEach(pl => {
                        stats[pl] = { name: pl, matches: 0, wins: 0, points: 0, scoreFor: 0, scoreAgainst: 0 };
                    });

                    this.rounds.forEach(round => {
                        if (!round || !round.matches) return;
                        round.matches.forEach(match => {
                            if (match.played && match.score1 !== '' && match.score2 !== '') {
                                let s1 = Number(match.score1) || 0;
                                let s2 = Number(match.score2) || 0;

                                let t1Wins = s1 > s2;
                                let t2Wins = s2 > s1;

                                match.team1.forEach(p => {
                                    if (stats[p]) {
                                        stats[p].matches++;
                                        if (t1Wins) stats[p].wins++;
                                        stats[p].points += s1;
                                        stats[p].scoreFor += s1;
                                        stats[p].scoreAgainst += s2;
                                    }
                                });

                                match.team2.forEach(p => {
                                    if (stats[p]) {
                                        stats[p].matches++;
                                        if (t2Wins) stats[p].wins++;
                                        stats[p].points += s2;
                                        stats[p].scoreFor += s2;
                                        stats[p].scoreAgainst += s1;
                                    }
                                });
                            }
                        });
                    });

                    return Object.values(stats).sort((a, b) => {
                        if (b.points !== a.points) return b.points - a.points;
                        if (b.wins !== a.wins) return b.wins - a.wins;
                        return (b.scoreFor - b.scoreAgainst) - (a.scoreFor - a.scoreAgainst);
                    });
                }
            }
        }
    </script>
