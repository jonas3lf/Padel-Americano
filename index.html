<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Americano Turnaj</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="americanoApp()">

    <header class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black tracking-wider text-emerald-400 flex items-center gap-2">
                🎾 PADEL AMERICANO
            </h1>
            <nav class="flex bg-slate-900 p-1 rounded-xl border border-slate-700 text-sm">
                <button @click="tab = 'setup'" :class="tab === 'setup' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-4 py-2 rounded-lg font-medium transition">Nastavení</button>
                <button @click="tab = 'matches'" :class="tab === 'matches' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-4 py-2 rounded-lg font-medium transition" :disabled="!isStarted">Zápasy</button>
                <button @click="tab = 'table'" :class="tab === 'table' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-4 py-2 rounded-lg font-medium transition" :disabled="!isStarted">Živá tabulka</button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">

        <!-- 1. SEKCE: NASTAVENÍ -->
        <div x-show="tab === 'setup'" class="space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-emerald-300">1. Seznam hráčů</h2>
                <div class="flex gap-2 mb-4">
                    <input type="text" x-model="newPlayerName" @keydown.enter="addPlayer" placeholder="Jméno hráče..." class="flex-1 bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
                    <button @click="addPlayer" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold transition">Přidat</button>
                </div>

                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Hromadné vložení (každé jméno na nový řádek):</label>
                    <textarea x-model="bulkPlayers" rows="3" placeholder="Jan Novák&#10;Petr Svoboda&#10;..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500"></textarea>
                    <button @click="addBulkPlayers" class="mt-2 bg-slate-700 hover:bg-slate-600 text-xs text-white px-4 py-2 rounded-lg font-semibold transition">Vložit seznam</button>
                </div>

                <div class="flex flex-wrap gap-2 mt-4">
                    <template x-for="(player, index) in players" :key="index">
                        <div class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 text-sm">
                            <span x-text="player"></span>
                            <button @click="removePlayer(index)" class="text-rose-400 hover:text-rose-300 font-bold">&times;</button>
                        </div>
                    </template>
                </div>
                <p class="text-xs text-slate-400 mt-3">Celkem hráčů: <span class="font-bold text-white" x-text="players.length"></span> (ideálně násobek 4)</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-emerald-300">2. Parametry turnaje</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Počet kurtů</label>
                        <input type="number" x-model.number="courts" min="1" class="w-full bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Body na zápas (např. 24, 32)</label>
                        <input type="number" x-model.number="pointsPerMatch" min="4" step="2" class="w-full bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <button @click="generateTournament" class="w-full mt-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition">
                    🚀 Vygenerovat rozlosování turnaje
                </button>
            </div>
        </div>

        <!-- 2. SEKCE: ZÁPASY -->
        <div x-show="tab === 'matches'" class="space-y-6">
            <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <div class="flex items-center gap-2">
                    <button @click="currentRound > 0 ? currentRound-- : null" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm font-bold" :disabled="currentRound === 0">◀ Předchozí</button>
                    <span class="font-bold text-emerald-400 px-2">Kolo <span x-text="currentRound + 1"></span> / <span x-text="rounds.length"></span></span>
                    <button @click="currentRound < rounds.length - 1 ? currentRound++ : null" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm font-bold" :disabled="currentRound === rounds.length - 1">Další ▶</button>
                </div>
                <div class="text-xs text-slate-400">Zápasy se ukládají automaticky</div>
            </div>

            <template x-if="rounds.length > 0">
                <div class="space-y-4">
                    <template x-for="(match, mIndex) in rounds[currentRound]" :key="mIndex">
                        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg">
                            <div class="text-xs font-bold text-emerald-400 mb-3 uppercase tracking-wider" x-text="'Kurt ' + (mIndex + 1)"></div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-5 items-center gap-4">
                                <!-- Tým 1 -->
                                <div class="md:col-span-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                                    <div class="text-xs text-slate-400 mb-1 font-semibold">Tým 1</div>
                                    <div class="text-sm font-bold text-white" x-text="match.team1[0] + ' & ' + match.team1[1]"></div>
                                </div>

                                <!-- Skóre / Výsledek -->
                                <div class="flex justify-center items-center gap-3">
                                    <input type="number" min="0" :max="pointsPerMatch" x-model.number="match.score1" @input="updateScore(currentRound, mIndex, 1)" class="w-16 h-14 bg-slate-900 border border-slate-700 text-center text-xl font-black rounded-xl text-emerald-400 focus:outline-none focus:border-emerald-500">
                                    <span class="text-slate-500 font-bold">:</span>
                                    <input type="number" min="0" :max="pointsPerMatch" x-model.number="match.score2" @input="updateScore(currentRound, mIndex, 2)" class="w-16 h-14 bg-slate-900 border border-slate-700 text-center text-xl font-black rounded-xl text-emerald-400 focus:outline-none focus:border-emerald-500">
                                </div>

                                <!-- Tým 2 -->
                                <div class="md:col-span-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-right md:text-left">
                                    <div class="text-xs text-slate-400 mb-1 font-semibold">Tým 2</div>
                                    <div class="text-sm font-bold text-white" x-text="match.team2[0] + ' & ' + match.team2[1]"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- 3. SEKCE: ŽIVÁ TABULKA -->
        <div x-show="tab === 'table'" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
                <div class="p-4 bg-slate-800/80 border-b border-slate-700 font-bold text-emerald-300">Průběžné pořadí hráčů</div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase border-b border-slate-700">
                                <th class="p-3.5 text-center w-12">#</th>
                                <th class="p-3.5">Hráč</th>
                                <th class="p-3.5 text-center">Zápasy</th>
                                <th class="p-3.5 text-center">Skóre</th>
                                <th class="p-3.5 text-center font-bold text-emerald-400">Body</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50 text-sm">
                            <template x-for="(row, index) in standings" :key="row.name">
                                <tr class="hover:bg-slate-700/20 transition">
                                    <td class="p-3.5 text-center font-bold text-slate-400" x-text="index + 1"></td>
                                    <td class="p-3.5 font-semibold text-white" x-text="row.name"></td>
                                    <td class="p-3.5 text-center text-slate-300" x-text="row.matches"></td>
                                    <td class="p-3.5 text-center text-slate-300" x-text="row.scoreFor + ':' + row.scoreAgainst"></td>
                                    <td class="p-3.5 text-center font-black text-emerald-400 text-base" x-text="row.points"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        function americanoApp() {
            return {
                tab: 'setup',
                players: ['Jan', 'Petr', 'Pavel', 'Tomáš', 'Ondřej', 'Martin', 'Lukáš', 'David'],
                newPlayerName: '',
                bulkPlayers: '',
                courts: 2,
                pointsPerMatch: 24,
                isStarted: false,
                rounds: [],
                currentRound: 0,

                init() {
                    const saved = localStorage.getItem('padel_americano_state');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.players = data.players || this.players;
                        this.courts = data.courts || 2;
                        this.pointsPerMatch = data.pointsPerMatch || 24;
                        this.rounds = data.rounds || [];
                        this.isStarted = data.isStarted || false;
                    }
                },

                saveState() {
                    localStorage.setItem('padel_americano_state', JSON.stringify({
                        players: this.players,
                        courts: this.courts,
                        pointsPerMatch: this.pointsPerMatch,
                        rounds: this.rounds,
                        isStarted: this.isStarted
                    }));
                },

                addPlayer() {
                    if (this.newPlayerName.trim()) {
                        this.players.push(this.newPlayerName.trim());
                        this.newPlayerName = '';
                        this.saveState();
                    }
                },

                addBulkPlayers() {
                    const lines = this.bulkPlayers.split('\n');
                    lines.forEach(l => {
                        if (l.trim()) this.players.push(l.trim());
                    });
                    this.bulkPlayers = '';
                    this.saveState();
                },

                removePlayer(index) {
                    this.players.splice(index, 1);
                    this.saveState();
                },

                generateTournament() {
                    if (this.players.length < 4) {
                        alert('Pro turnaj Americano je potřeba alespoň 4 hráčů.');
                        return;
                    }

                    let p = [...this.players];
                    // Pokud není počet hráčů dělitelný 4, doplníme prázdného "ghost" hráče pro pauzy
                    while (p.length % 4 !== 0) {
                        p.push('(Volno)');
                    }

                    const numPlayers = p.length;
                    const numRounds = numPlayers - 1; 
                    let generatedRounds = [];

                    let workingPlayers = [...p];
                    const fixedPlayer = workingPlayers[0];
                    let rotatingPlayers = workingPlayers.slice(1);

                    for (let r = 0; r < numRounds; r++) {
                        let roundPlayers = [fixedPlayer, ...rotatingPlayers];
                        let matchesInRound = [];
                        
                        let matchesPerCourt = Math.floor(roundPlayers.length / 4);
                        for (let c = 0; c < this.courts && c < matchesPerCourt; c++) {
                            let team1 = [roundPlayers[c * 2], roundPlayers[roundPlayers.length - 1 - c * 2]];
                            let team2 = [roundPlayers[c * 2 + 1], roundPlayers[roundPlayers.length - 2 - c * 2]];

                            // Zahrnout zápas pouze pokud neobsahuje volno (ghost) jako celý tým
                            matchesInRound.push({
                                team1: team1,
                                team2: team2,
                                score1: 0,
                                score2: 0
                            });
                        }
                        generatedRounds.push(matchesInRound);

                        // Rotace pro další kolo (Algoritmus pro Americano/Round Robin)
                        rotatingPlayers.unshift(rotatingPlayers.pop());
                    }

                    this.rounds = generatedRounds;
                    this.isStarted = true;
                    this.currentRound = 0;
                    this.tab = 'matches';
                    this.saveState();
                },

                updateScore(roundIdx, matchIdx, teamNum) {
                    let match = this.rounds[roundIdx][matchIdx];
                    if (teamNum === 1) {
                        if (match.score1 > this.pointsPerMatch) match.score1 = this.pointsPerMatch;
                        if (match.score1 < 0) match.score1 = 0;
                        match.score2 = this.pointsPerMatch - match.score1;
                    } else {
                        if (match.score2 > this.pointsPerMatch) match.score2 = this.pointsPerMatch;
                        if (match.score2 < 0) match.score2 = 0;
                        match.score1 = this.pointsPerMatch - match.score2;
                    }
                    this.saveState();
                },

                get standings() {
                    let stats = {};
                    this.players.forEach(pl => {
                        stats[pl] = { name: pl, matches: 0, points: 0, scoreFor: 0, scoreAgainst: 0 };
                    });

                    this.rounds.forEach(round => {
                        round.forEach(match => {
                            let s1 = match.score1 || 0;
                            let s2 = match.score2 || 0;

                            // Tým 1
                            match.team1.forEach(p => {
                                if (stats[p]) {
                                    stats[p].matches++;
                                    stats[p].points += s1;
                                    stats[p].scoreFor += s1;
                                    stats[p].scoreAgainst += s2;
                                }
                            });

                            // Tým 2
                            match.team2.forEach(p => {
                                if (stats[p]) {
                                    stats[p].matches++;
                                    stats[p].points += s2;
                                    stats[p].scoreFor += s2;
                                    stats[p].scoreAgainst += s1;
                                }
                            });
                        });
                    });

                    return Object.values(stats).sort((a, b) => {
                        if (b.points !== a.points) return b.points - a.points;
                        return (b.scoreFor - b.scoreAgainst) - (a.scoreFor - a.scoreAgainst);
                    });
                }
            }
        }
    </script>
</body>
</html>
